<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P-REC Avoided Emissions Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

<!-- ========================= HEADER ========================= -->
<header class="bg-teal-700 text-white py-10 px-6 md:px-12 shadow">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-4xl md:text-5xl font-bold mb-3">P-REC Avoided Emissions Calculator</h1>
    <p class="text-xl text-teal-50">
      Estimated climate benefits from P-REC procurement.
    </p>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 md:px-12 py-10">
<div class="grid grid-cols-1 lg:grid-cols-2 gap-10">

<!-- ========================= LEFT INPUT ========================= -->
<section>

<h2 class="text-3xl font-bold mb-6">1. Project & Buyer Inputs</h2>

<!-- Input Mode -->
<div class="mb-4">
  <label class="block text-sm font-medium mb-2">Input Method</label>
  <select id="inputMode" class="w-full border rounded-md px-3 py-2">
    <option value="budget">Use Budget ($)</option>
    <option value="quantity">Use P-RECs Purchased (MWh)</option>
  </select>
</div>

<!-- Budget + Price -->
<div id="budgetBlock" class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div>
    <label class="text-sm">Buyer Budget ($)</label>
    <input id="budget" type="number" value="100000"
      class="w-full border rounded-md px-3 py-2" />
  </div>

  <div>
    <label class="text-sm">P-REC Price ($/MWh)</label>
    <input id="price" type="number" value="45"
      class="w-full border rounded-md px-3 py-2" />
  </div>
</div>

<!-- Manual Quantity -->
<div id="quantityBlock" style="display:none;">
  <label class="text-sm">P-RECs Purchased (MWh)</label>
  <input id="manualQuantity" type="number" value="2000"
    class="w-full border rounded-md px-3 py-2" />
</div>

<!-- Project EF -->
<div class="mt-4">
  <label class="text-sm">Project Emission Factor (tCO2e/MWh)</label>
  <input id="projectEF" type="number" value="0"
    class="w-full border rounded-md px-3 py-2" />
</div>

<!-- Percent Inputs -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
  <div>
    <label class="text-sm">Delivery %</label>
    <input id="delivery" type="number" value="80"
      class="w-full border rounded-md px-3 py-2" />
  </div>

  <div>
    <label class="text-sm">Displace %</label>
    <input id="displace" type="number" value="100"
      class="w-full border rounded-md px-3 py-2" />
  </div>

  <div>
    <label class="text-sm">Cons. Factor %</label>
    <input id="consFactor" type="number" value="100"
      class="w-full border rounded-md px-3 py-2" />
  </div>
</div>

<!-- Baseline -->
<h2 class="text-2xl font-bold mt-10 mb-4">2. Existing Off-Grid Baseline Mix (%)</h2>

<div class="space-y-3">
  <input id="dieselShare" type="number" value="70" class="w-full border px-3 py-2" placeholder="Diesel"/>
  <input id="gridShare" type="number" value="0" class="w-full border px-3 py-2" placeholder="Grid"/>
  <input id="keroseneShare" type="number" value="21" class="w-full border px-3 py-2" placeholder="Kerosene"/>
  <input id="candleShare" type="number" value="9" class="w-full border px-3 py-2" placeholder="Candle"/>
  <input id="otherShare" type="number" value="0" class="w-full border px-3 py-2" placeholder="Other"/>
</div>

<div id="baselineTotalBox" class="mt-4 p-3 bg-green-100 text-center font-bold">
  Total Baseline Share: 100%
</div>

</section>

<!-- ========================= RIGHT OUTPUT ========================= -->
<section>

<h2 class="text-3xl font-bold mb-6">Results</h2>

<div class="space-y-4">
  <div>P-RECs Purchased: <span id="pRecsPurchased"></span></div>
  <div>Avoided Emissions: <span id="avoidedEmissions"></span></div>
  <div>Cost per tCO2e: <span id="costPerTon"></span></div>
</div>

</section>

</div>
</main>

<script>
function calculate() {

const budget = parseFloat(document.getElementById("budget").value) || 0;
const price = parseFloat(document.getElementById("price").value) || 0;
const mode = document.getElementById("inputMode").value;

let pRecs = 0;

if (mode === "budget") {
  pRecs = price > 0 ? budget / price : 0;
} else {
  pRecs = parseFloat(document.getElementById("manualQuantity").value) || 0;
}

const delivery = document.getElementById("delivery").value / 100;
const displace = document.getElementById("displace").value / 100;
const cons = document.getElementById("consFactor").value / 100;

const baselineEF = 0.5; // 简化

const avoided = pRecs * delivery * displace * cons * baselineEF;
const cost = avoided > 0 ? budget / avoided : 0;

document.getElementById("pRecsPurchased").innerText = pRecs.toFixed(0);
document.getElementById("avoidedEmissions").innerText = avoided.toFixed(1);
document.getElementById("costPerTon").innerText = cost.toFixed(2);
}

// 切换模式
document.getElementById("inputMode").addEventListener("change", () => {
  const mode = document.getElementById("inputMode").value;

  document.getElementById("budgetBlock").style.display =
    mode === "budget" ? "grid" : "none";

  document.getElementById("quantityBlock").style.display =
    mode === "quantity" ? "block" : "none";

  calculate();
});

document.querySelectorAll("input, select").forEach(el => {
  el.addEventListener("input", calculate);
});

calculate();
</script>

</body>
</html>
